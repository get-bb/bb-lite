app = "bb-next-tunnel"
primary_region = "sjc"

[build]
dockerfile = "Dockerfile"

[env]
BASE_DOMAIN = "fly.getbb.dev"
RELAY_URL = "https://getbb.dev"
PORT = "8080"
FRP_PORT = "7000"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[http_service.concurrency]
type = "requests"
soft_limit = 2000
hard_limit = 4000

[[http_service.checks]]
grace_period = "10s"
interval = "15s"
method = "GET"
path = "/__gate/health"
timeout = "5s"

[[services]]
internal_port = 7000
protocol = "tcp"
auto_stop_machines = "off"
auto_start_machines = true

[[services.ports]]
port = 7000
handlers = ["tls"]

[[vm]]
size = "shared-cpu-2x"
memory = "1gb"
